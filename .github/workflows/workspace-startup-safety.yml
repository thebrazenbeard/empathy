name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart:
    # VS Code workspaces are used on Windows hosts as well as Linux. Keep the
    # source-level startup guard running on both paths and Python runtimes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject hidden workspace startup execution
        run: python -m unittest discover -s tests -p test_workspace_startup_safety.py -v
